<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=/app/">
    <title>Agent Console</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7f2;
            --surface: #fffdf8;
            --line: #d8dfd8;
            --text: #1f2a27;
            --muted: #6d7b75;
            --blue: #2f6f9f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                linear-gradient(90deg, rgba(47, 111, 159, 0.06) 1px, transparent 1px),
                linear-gradient(180deg, rgba(22, 124, 115, 0.05) 1px, transparent 1px),
                var(--bg);
            background-size: 36px 36px, 36px 36px, auto;
            color: var(--text);
            font-family: "Aptos", "Segoe UI", "Microsoft YaHei UI", sans-serif;
        }

        main {
            width: min(560px, calc(100vw - 32px));
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 28px;
            background: var(--surface);
            box-shadow: 0 18px 45px rgba(32, 42, 38, 0.08);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        p {
            margin: 8px 0;
            color: var(--muted);
        }

        a {
            color: var(--blue);
            font-weight: 800;
        }
    </style>
</head>
<body>
<main>
    <h1>Agent Console is loading</h1>
    <p>请通过 Spring Boot 地址访问，直接打开本地文件无法使用 API 与 SSE。</p>
    <p><a href="/app/">Open Vue Agent Console</a></p>
</main>
</body>
</html>
